<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Long article (desktop load)</title>
<!--
  Everyday desktop load, page 2 of 3: a long document being read. At load it
  builds 300 sections of text with tables and a contents sidebar (a large DOM,
  as a long news or documentation page has), then scrolls through it a little
  every 50 ms, wrapping to the top, while a scroll handler highlights the
  current section. The document is built once and never grows. Offline: the
  text comes from a fixed-seed generator, so every run lays out the same page.
-->
<style>
  body { font: 16px/1.6 Georgia, serif; margin: 0; color: #222; }
  nav { position: fixed; top: 0; left: 0; bottom: 0; width: 240px; overflow-y: auto; background: #fafafa; border-right: 1px solid #ddd; font: 12px/1.5 sans-serif; padding: 8px; }
  nav a { display: block; color: #345; text-decoration: none; padding: 1px 4px; }
  nav a.current { background: #345; color: #fff; }
  article { margin-left: 270px; max-width: 760px; padding: 16px; }
  table { border-collapse: collapse; margin: 8px 0; font: 13px sans-serif; }
  td, th { border: 1px solid #ccc; padding: 2px 6px; }
</style>
</head>
<body>
<nav id="toc"></nav>
<article id="doc"></article>
<script>
"use strict";
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = rng(424242);
const words = ("the system user command file directory shell model request safety undo package service " +
  "memory process network desktop window terminal session analysis result change state record table " +
  "evidence before after every which would could should because therefore however although often " +
  "simple careful local private ordinary recoverable irreversible ask run read write delete move copy").split(" ");
function sentence() {
  const n = 8 + Math.floor(rand() * 14), out = [];
  for (let i = 0; i < n; i++) out.push(words[Math.floor(rand() * words.length)]);
  const s = out.join(" ");
  return s[0].toUpperCase() + s.slice(1) + ".";
}
function paragraph() {
  const n = 4 + Math.floor(rand() * 5), out = [];
  for (let i = 0; i < n; i++) out.push(sentence());
  return out.join(" ");
}
const SECTIONS = 300;
const doc = document.getElementById("doc"), toc = document.getElementById("toc");
const heads = [], links = [];
for (let s = 0; s < SECTIONS; s++) {
  const h = document.createElement("h2");
  h.id = "s" + s;
  h.textContent = (s + 1) + ". " + sentence().slice(0, 48);
  doc.appendChild(h);
  heads.push(h);
  const a = document.createElement("a");
  a.href = "#s" + s;
  a.textContent = h.textContent;
  toc.appendChild(a);
  links.push(a);
  for (let p = 0; p < 4; p++) {
    const para = document.createElement("p");
    para.textContent = paragraph();
    doc.appendChild(para);
  }
  if (s % 5 === 0) {
    const t = document.createElement("table");
    let html = "<tr><th>Item</th><th>Before</th><th>After</th></tr>";
    for (let r = 0; r < 6; r++) html += "<tr><td>" + words[Math.floor(rand() * words.length)] + "</td><td>" + Math.floor(rand() * 1000) + "</td><td>" + Math.floor(rand() * 1000) + "</td></tr>";
    t.innerHTML = html;
    doc.appendChild(t);
  }
}
let current = -1;
function highlight() {
  // Binary search for the last heading above the viewport's top.
  let lo = 0, hi = heads.length - 1, found = 0;
  const y = window.scrollY + 10;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (heads[mid].offsetTop <= y) { found = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (found !== current) {
    if (current >= 0) links[current].classList.remove("current");
    links[found].classList.add("current");
    current = found;
  }
}
window.addEventListener("scroll", highlight, { passive: true });
function step() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  if (window.scrollY >= max - 1) window.scrollTo(0, 0); else window.scrollBy(0, 12);
  // A background tab does not scroll the viewport, so the work is done
  // either way: the highlight is recomputed on every step.
  highlight();
}
setInterval(step, 50);
window.addEventListener("load", function () {
  highlight();
  console.log("DESKTOP_LOAD_READY article");
});
</script>
</body>
</html>
